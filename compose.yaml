services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: switchstand
      POSTGRES_USER: switchstand
      POSTGRES_PASSWORD: switchstand
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchstand"]
      interval: 2s
      timeout: 2s
      retries: 15
  controller:
    build: .
    command: ["sh", "-c", "uv run alembic upgrade head && exec uv run switchstand"]
    stdin_open: true
    environment:
      DATABASE_URL: postgresql+psycopg://switchstand:switchstand@postgres/switchstand
      ASANA_TOKEN: ${ASANA_TOKEN:?required}
      ACTIVE_WORK_ID: ${ACTIVE_WORK_ID:?required}
      REFERENCE_WORK_IDS: ${REFERENCE_WORK_IDS:-}
    depends_on:
      postgres: {condition: service_healthy}
