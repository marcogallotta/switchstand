name: switchstand

services:
  postgres:
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: switchstand
      POSTGRES_USER: switchstand
      POSTGRES_PASSWORD: switchstand
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchstand"]
      interval: 2s
      timeout: 2s
      retries: 15
  postgres-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: switchstand_test
      POSTGRES_USER: switchstand
      POSTGRES_PASSWORD: switchstand
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchstand"]
      interval: 2s
      timeout: 2s
      retries: 15
    tmpfs:
      - /var/lib/postgresql
  controller:
    build:
      context: .
      target: runtime
    command:
      - sh
      - -c
      - |
        : "$${ASANA_TOKEN:?required}"
        : "$${ACTIVE_WORK_ID:?required}"
        uv run --no-sync alembic upgrade head && exec uv run --no-sync switchstand
    stdin_open: true
    env_file:
      - ${HOME}/.config/switchstand/.env
    environment:
      DATABASE_URL: postgresql+psycopg://switchstand:switchstand@postgres/switchstand
      ACTIVE_WORK_ID: ${ACTIVE_WORK_ID:-}
      REFERENCE_WORK_IDS: ${REFERENCE_WORK_IDS:-}
    depends_on:
      postgres: {condition: service_healthy}
  quality:
    build:
      context: .
      target: development
    command:
      - sh
      - -c
      - uv run --no-sync ruff check . && uv run --no-sync pyright && uv run --no-sync pytest
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://switchstand:switchstand@postgres-test/switchstand_test
    depends_on:
      postgres-test: {condition: service_healthy}

volumes:
  postgres-data:
