<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <meta name="referrer" content="no-referrer">
    <title>Switchstand</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page">
      <header class="intro">
        <div>
          <p id="eyebrow" class="eyebrow">Switchstand</p>
          <h1>Switchstand</h1>
          <p id="description"></p>
        </div>
        <p id="headline-facts" class="facts"></p>
      </header>
      <div id="error" class="error" hidden></div>
      <div id="native-surface" hidden>
        <section id="observer" class="observer" aria-live="polite"></section>
        <section id="current-target" class="current-target" aria-live="polite" hidden>
          <strong id="current-target-summary">No current target selected.</strong>
          <form id="native-input-form" class="form" hidden>
            <label for="native-input">Message current target</label>
            <textarea id="native-input" data-focus-key="native-input" required></textarea>
            <div class="actions">
              <button id="native-input-submit" class="button button--primary" type="submit">Send exact message</button>
              <span id="native-input-outcome" class="muted" aria-live="polite"></span>
            </div>
          </form>
        </section>
        <section class="board-grid">
          <article class="panel">
            <h2>Agent tree</h2>
            <div id="tree"></div>
          </article>
          <article class="panel">
            <h2>Observed endpoint differences</h2>
            <p id="disclosure" class="muted"></p>
            <ol id="trail" class="list"></ol>
          </article>
        </section>
      </div>
      <section id="roles" class="role-grid" aria-live="polite" hidden></section>
    </main>
    <script src="/native_selection_controller.js" defer></script>
    <script src="/app.js" defer></script>
  </body>
</html>
