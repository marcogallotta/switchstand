<title>Mailbox wake</title>
<h1>Mailbox wake</h1>
<p>Re-arm configured chats for the next scheduled check. History is retained.</p>
<p>This does not confirm delivery or reopen missing chat tabs. A wake may repeat.</p>
<button id="rearm">Re-arm all</button>
<p id="status" role="status"></p>
