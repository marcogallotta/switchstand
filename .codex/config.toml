default_permissions = "switchstand-development"

[permissions.switchstand-development]
description = "Bounded local development for the active Switchstand work."
extends = ":workspace"

[permissions.switchstand-development.filesystem]
"~/.config/switchstand/.env" = "deny"
glob_scan_max_depth = 6

[permissions.switchstand-development.filesystem.":workspace_roots"]
"**/*.env*" = "deny"

[permissions.switchstand-development.network]
enabled = false

[permissions.switchstand-development.network.unix_sockets]
"/var/run/docker.sock" = "deny"

[mcp_servers.switchstand]
command = "scripts/switchstand-controller-mcp"
env_vars = ["HOME", "SWITCHSTAND_MANAGED", "ACTIVE_WORK_ID", "REFERENCE_WORK_IDS"]
required = false
enabled_tools = ["work_get", "source_task", "source_stories", "source_story", "work_append"]

[mcp_servers.switchstand.tools.work_get]
approval_mode = "approve"

[mcp_servers.switchstand.tools.source_task]
approval_mode = "approve"

[mcp_servers.switchstand.tools.source_stories]
approval_mode = "approve"

[mcp_servers.switchstand.tools.source_story]
approval_mode = "approve"

[mcp_servers.switchstand.tools.work_append]
approval_mode = "approve"

[mcp_servers.switchstand_development]
command = "scripts/switchstand-development-mcp"
env_vars = ["SWITCHSTAND_WORKTREE", "SWITCHSTAND_BRANCH", "SWITCHSTAND_GIT_COMMON",
            "SWITCHSTAND_QUALITY_IMAGE", "SWITCHSTAND_QUALITY_NETWORK",
            "SWITCHSTAND_DATABASE_CONTAINER", "SWITCHSTAND_MANIFEST_SHA256",
            "SWITCHSTAND_MANAGED"]
required = false
enabled_tools = ["check", "commit_all_current_worktree", "quality", "run_status"]

[mcp_servers.switchstand_development.tools.check]
approval_mode = "approve"

[mcp_servers.switchstand_development.tools.commit_all_current_worktree]
approval_mode = "approve"

[mcp_servers.switchstand_development.tools.quality]
approval_mode = "approve"

[mcp_servers.switchstand_development.tools.run_status]
approval_mode = "approve"
