approval_policy = "never"
default_permissions = "switchstand-development"

[permissions.switchstand-development]
description = "Bounded local development for the active Switchstand work."
extends = ":workspace"

[permissions.switchstand-development.filesystem]
"~/.config/switchstand/.env" = "deny"
glob_scan_max_depth = 6

[permissions.switchstand-development.filesystem.":workspace_roots"]
"**/*.env*" = "deny"

[permissions.switchstand-development.network]
enabled = true

[permissions.switchstand-development.network.unix_sockets]
"/var/run/docker.sock" = "deny"

[mcp_servers.switchstand]
# Ordinary in-repo Codex owns the authenticated provider-neutral HTTP/OAuth endpoint
# directly; it must not depend on a pre-existing user-level server with the same name.
url = "https://laptop.tail46f0b9.ts.net/switchstand/mcp"
required = false
auth = "oauth"
default_tools_approval_mode = "approve"
enabled_tools = ["grant_get", "work_get", "work_search", "work_resolve_reference",
                 "work_structure", "source_task", "source_stories", "source_story",
                 "work_history", "work_attachments", "work_event", "work_append",
                 "work_create", "work_update", "message_send", "message_pending",
                 "required_result_save"]

# Supersede the temporary user-level proof alias. Both names target the same endpoint,
# but only the repository-owned canonical server carries this project's tool policy.
[mcp_servers.switchstand_oauth_proof]
enabled = false

[mcp_servers.switchstand.tools.grant_get]
approval_mode = "approve"

[mcp_servers.switchstand.tools.work_get]
approval_mode = "approve"

[mcp_servers.switchstand.tools.work_search]
approval_mode = "approve"

[mcp_servers.switchstand.tools.work_resolve_reference]
approval_mode = "approve"

