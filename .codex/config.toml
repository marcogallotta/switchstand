approval_policy = "never"
default_permissions = ":danger-full-access"

[features]
hooks = true
multi_agent = true
apps = false

[[hooks.UserPromptSubmit]]

[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/scripts/codex-feedback-trigger-hook"'
timeout = 1
additionalContextLimit = 700

[[hooks.SessionStart]]
matcher = "^compact$"

[[hooks.SessionStart.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/scripts/codex-feedback-trigger-hook"'
timeout = 1
additionalContextLimit = 700

[[hooks.PostToolUse]]

[[hooks.PostToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/scripts/codex-feedback-trigger-hook"'
timeout = 1
additionalContextLimit = 700

[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/scripts/codex-stop-mailbox"'
timeout = 5

[[hooks.Stop.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/scripts/codex-continuity-hook" --mode PILOT --lifetime STANDING --telemetry "$HOME/.local/state/switchstand/codex/continuity.jsonl"'
timeout = 3

[[hooks.PreToolUse]]
matcher = "^Bash$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = '"$(git rev-parse --show-toplevel)/scripts/codex-hook" --coordinator-primary "$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"'
timeout = 10
statusMessage = "Protecting canonical primary source"

[permissions.switchstand-development]
description = "Bounded local development for the active Switchstand work."
extends = ":workspace"

[permissions.switchstand-development.filesystem]
"~/.config/switchstand/.env" = "deny"
glob_scan_max_depth = 6

[permissions.switchstand-development.filesystem.":workspace_roots"]
"**/*.env*" = "deny"

[permissions.switchstand-development.network]
enabled = true

[permissions.switchstand-development.network.unix_sockets]
"/var/run/docker.sock" = "deny"

[mcp_servers.switchstand]
# Ordinary in-repo Codex owns the authenticated provider-neutral HTTP/OAuth endpoint
# directly; it must not depend on a pre-existing user-level server with the same name.
url = "https://laptop.tail46f0b9.ts.net/switchstand/mcp"
required = true
default_tools_approval_mode = "approve"
enabled_tools = ["repository_bundle_get", "repository_candidate_qualification_get", "work_get", "human_trajectory_get", "work_search", "work_resolve_reference",
                 "work_history", "work_event", "work_append", "observability_get", "capability_preflight_get",
                 "project_create",
                 "work_create", "work_update", "human_trajectory_record", "outcome_state_update", "implementation_request", "work_relate",
                 "file_bug", "file_feature", "file_process", "file_performance", "file_review_feedback", "file_fork_management",
                 "required_result_save", "agent_register", "agent_takeover", "agent_transfer_request",
                 "agent_message_send", "agent_message_pending", "agent_message_receive",
                 "agent_message_recover", "agent_message_result_send", "agent_message_acknowledge",
                 "agent_message_disposition"]

# Supersede the temporary user-level proof alias. Both names target the same endpoint,
# but only the repository-owned canonical server carries this project's tool policy.
[mcp_servers.switchstand_oauth_proof]
enabled = false
url = "https://laptop.tail46f0b9.ts.net/switchstand/mcp"

[mcp_servers.switchstand_certification]
enabled = false
url = "https://laptop.tail46f0b9.ts.net:8446/mcp"
required = false
default_tools_approval_mode = "approve"
enabled_tools = ["repository_bundle_get", "repository_candidate_qualification_get", "work_get", "human_trajectory_get", "work_search", "work_resolve_reference",
                 "work_history", "work_event", "work_append", "observability_get", "capability_preflight_get",
                 "project_create",
                 "work_create", "work_update", "human_trajectory_record", "outcome_state_update", "implementation_request", "work_relate",
                 "file_bug", "file_feature", "file_process", "file_performance", "file_review_feedback", "file_fork_management",
                 "required_result_save", "agent_register", "agent_takeover", "agent_transfer_request",
                 "agent_message_send", "agent_message_pending", "agent_message_receive",
                 "agent_message_recover", "agent_message_result_send", "agent_message_acknowledge",
                 "agent_message_disposition"]


[mcp_servers.switchstand_managed]
command = "scripts/switchstand-controller-mcp"
env_vars = ["HOME", "SWITCHSTAND_MANAGED", "ACTIVE_WORK_ID", "REFERENCE_WORK_IDS",
            "SWITCHSTAND_WORKTREE", "SWITCHSTAND_BRANCH", "SWITCHSTAND_GIT_DIR",
            "SWITCHSTAND_RUN_ID", "SWITCHSTAND_BUGS_PROJECT_ID",
            "SWITCHSTAND_FEATURES_PROJECT_ID", "SWITCHSTAND_PROCESS_PROJECT_ID",
            "SWITCHSTAND_HUMAN_REVIEW_PROJECT_ID", "SWITCHSTAND_FORK_MANAGEMENT_PROJECT_ID"]
required = false
enabled_tools = ["work_get", "work_history", "work_event", "work_append", "work_update",
                 "file_bug", "file_feature", "file_process", "file_performance", "file_review_feedback", "file_fork_management",
                 "priority_claim_get", "priority_claim_record", "priority_context_get",
                 "message_pending", "message_receive", "message_recover", "message_result_send", "message_disposition", "capability_preflight_get"]
default_tools_approval_mode = "approve"

[mcp_servers.switchstand_development]
command = "scripts/switchstand-development-mcp"
default_tools_approval_mode = "approve"
env_vars = ["SWITCHSTAND_WORKTREE", "SWITCHSTAND_BRANCH", "SWITCHSTAND_GIT_COMMON",
            "SWITCHSTAND_RUN_ID",
            "SWITCHSTAND_QUALITY_IMAGE", "SWITCHSTAND_QUALITY_NETWORK",
            "SWITCHSTAND_DATABASE_CONTAINER", "SWITCHSTAND_MANIFEST_SHA256",
            "SWITCHSTAND_MANAGED"]
required = false
enabled_tools = ["check", "commit_all_current_worktree", "diagnostic_full_suite", "run_status"]
