name: Current repository bundle publisher
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Exact single branch to export with complete original history
        type: string
        default: main
        required: true
  workflow_run:
    workflows: [Quality]
    types: [completed]
jobs:
  repository-bundle:
    name: Current repository bundle
    if: >-
      vars.SWITCHSTAND_REPOSITORY_BUNDLE_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: switchstand-repository-bundle-current
      cancel-in-progress: false
    env:
      BUNDLE_NAME: switchstand-current.bundle
      MANIFEST_NAME: switchstand-current.manifest.json
      CHECKSUM_NAME: switchstand-current.bundle.sha256
      RELEASE_TAG: switchstand-repository-bundle-current
    steps:
      - name: Build and verify current bundle
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.event.workflow_run.head_branch }}
          EVENT_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git check-ref-format "refs/heads/$BRANCH"
          test "${BRANCH#-}" = "$BRANCH"
          case "$BRANCH" in *,*|@) exit 1 ;; esac
          if [ "$BRANCH" != main ]; then
            key="$(printf '%s' "$BRANCH" | sha256sum | cut -d' ' -f1)"
            BUNDLE_NAME="switchstand-branch-$key.bundle"
            MANIFEST_NAME="switchstand-branch-$key.manifest.json"
            CHECKSUM_NAME="switchstand-branch-$key.bundle.sha256"
          fi
          export BUNDLE_NAME MANIFEST_NAME CHECKSUM_NAME
          printf '%s\n' "BUNDLE_NAME=$BUNDLE_NAME" "MANIFEST_NAME=$MANIFEST_NAME" \
            "CHECKSUM_NAME=$CHECKSUM_NAME" >> "$GITHUB_ENV"
          git init --bare repository.git
          git -C repository.git remote add origin "https://github.com/${REPOSITORY}.git"
          ref="refs/heads/$BRANCH"
          git -C repository.git fetch --no-tags origin "+$ref:$ref"
          sha="$(git -C repository.git rev-parse "$ref")"
          printf '%s %s\n' "$ref" "$sha" > refs.txt
          git -C repository.git bundle create "$PWD/$BUNDLE_NAME" "$ref"
          git init --bare verify.git
          git -C verify.git bundle verify "$PWD/$BUNDLE_NAME"
          test "$(git bundle list-heads "$BUNDLE_NAME")" = "$sha $ref"
          git clone --quiet --branch "$BRANCH" "$PWD/$BUNDLE_NAME" materialized
          test "$(git -C materialized rev-parse HEAD)" = "$sha"
          bundle_sha256="$(sha256sum "$BUNDLE_NAME" | cut -d' ' -f1)"
          snapshot_digest="$(sha256sum refs.txt | cut -d' ' -f1)"
          BUNDLE_SHA256="$bundle_sha256" SNAPSHOT_DIGEST="$snapshot_digest" python - <<'PY'
          import json
          import os
          from pathlib import Path

          refs = dict(line.split() for line in Path("refs.txt").read_text().splitlines())
          manifest = {
              "repository": os.environ["REPOSITORY"],
              "refs": refs,
              "snapshot_digest": os.environ["SNAPSHOT_DIGEST"],
              "bundle_sha256": os.environ["BUNDLE_SHA256"],
              "provenance": {
                  "event_sha": os.environ["EVENT_SHA"],
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
              },
          }
          Path(os.environ["MANIFEST_NAME"]).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          printf '%s  %s\n' "$bundle_sha256" "$BUNDLE_NAME" > "$CHECKSUM_NAME"
      - name: Publish rolling cache
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target main \
              --title "Current repository bundle cache" \
              --notes "Rolling transport cache; GitHub refs remain source authority."
          fi
          gh release upload "$RELEASE_TAG" "$BUNDLE_NAME" --clobber
          gh release upload "$RELEASE_TAG" "$CHECKSUM_NAME" --clobber
          gh release upload "$RELEASE_TAG" "$MANIFEST_NAME" --clobber
