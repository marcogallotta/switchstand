name: Quality
run-name: Quality / ${{ github.event_name == 'pull_request' && 'composition' || github.event_name == 'schedule' && 'scheduled exact-head' || 'exact-head' }}
on:
  push:
  pull_request:
  schedule:
    - cron: "17 2 * * *"
permissions:
  actions: read
  contents: read
jobs:
  plan:
    name: Quality policy
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.policy.outputs.mode }}
      reasons: ${{ steps.policy.outputs.reasons }}
      selected_tests: ${{ steps.policy.outputs.selected_tests }}
      planner_json: ${{ steps.policy.outputs.planner_json }}
      adaptive_json: ${{ steps.policy.outputs.adaptive_json }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
          fetch-depth: 0
      - name: Bind exact subject and select fail-closed foreground policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_KIND: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_BASE_REPO: ${{ github.event.pull_request.base.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack != null && github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref }}
        run: |
          execution_sha="$(git rev-parse HEAD)"
          subject_verified=false
          stack_top=false
          if test "$EVENT_KIND" = pull_request; then
            stack_top=unknown
            if test -n "$PR_BASE_REF" && test -n "$PR_BASE_REPO" \
              && relations="$(gh api --method GET --paginate --slurp \
                "repos/$GITHUB_REPOSITORY/pulls" -f state=open -f per_page=100 \
                --jq '[[.[][] | select(.head.ref == env.PR_BASE_REF and .head.repo.full_name == env.PR_BASE_REPO)] | length, [.[][] | select(.base.ref == env.PR_HEAD_REF and .base.repo.full_name == env.PR_HEAD_REPO)] | length] | @tsv' 2>/dev/null)"; then
              read -r parents children <<< "$relations"
              stack_top="$(PYTHONPATH=src python3 -c \
                'from switchstand.affected_tests import classify_cumulative_stack_top as f; import sys; v=f(parent_count=int(sys.argv[1]), child_count=int(sys.argv[2])); print("unknown" if v is None else str(v).lower())' \
                "$parents" "$children")"
            fi
            planner_base_sha="$(git rev-parse HEAD^)"
            planner_head_sha="$PR_HEAD_SHA"
            if scripts/verify-quality-composition \
                "$EVENT_SHA" "$PR_HEAD_SHA" "$PR_BASE_SHA" \
                "$(git rev-parse "origin/$STACK_BASE_REF")" "${{ github.event.pull_request.stack.position }}"; then
              subject_verified=true
            fi
          elif test "$EVENT_KIND" = push; then
            planner_base_sha="$PUSH_BASE_SHA"
            planner_head_sha="$EVENT_SHA"
            if test "$execution_sha" = "$planner_head_sha" \
              && test "$PUSH_FORCED" != true \
              && printf '%s' "$planner_base_sha" | grep -Eq '^[0-9a-f]{40}$' \
              && test "$planner_base_sha" != 0000000000000000000000000000000000000000 \
              && git merge-base --is-ancestor "$planner_base_sha" "$planner_head_sha"; then
              subject_verified=true
            fi
          else
            planner_head_sha="$execution_sha"
            planner_base_sha="$(git rev-parse HEAD^)"
            subject_verified=true
          fi
          test "$stack_top" != unknown || subject_verified=false

          selector_health_clear=false
          current_blob="$(git rev-parse "$execution_sha:.github/workflows/quality.yml")"
          default_sha="$(git rev-parse "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
          main_blob="$(git rev-parse "origin/$DEFAULT_BRANCH:.github/workflows/quality.yml" 2>/dev/null || true)"
          history_file="$RUNNER_TEMP/broad-quality-history.tsv"
          : > "$history_file"
          history_complete=false
          if test "$current_blob" = "$main_blob"; then
            if push_count="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
                --method GET -f branch="$DEFAULT_BRANCH" -f event=push \
                -f status=completed -f per_page=1 --jq '.total_count' 2>/dev/null)" \
              && schedule_count="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
                --method GET -f event=schedule -f status=completed -f per_page=1 \
                --jq '.total_count' 2>/dev/null)" \
              && push_history="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
                --method GET --paginate -f branch="$DEFAULT_BRANCH" -f event=push \
                -f status=completed -f per_page=100 \
                --jq '.workflow_runs[] | ["push", .head_sha, .conclusion, .updated_at] | @tsv' 2>/dev/null)" \
              && schedule_history="$(gh api \
                "repos/$GITHUB_REPOSITORY/actions/workflows/quality.yml/runs" \
                --method GET --paginate -f event=schedule -f status=completed -f per_page=100 \
                --jq '.workflow_runs[] | ["schedule", .head_sha, .conclusion, .updated_at] | @tsv' \
                2>/dev/null)"; then
              history_fetched=true
              broad_history="$push_history"$'\n'"$schedule_history"
            else
              history_fetched=false
              broad_history=""
            fi
            push_complete=false
            schedule_complete=false
            test "${push_count:-1000}" -lt 1000 && push_complete=true
            test "${schedule_count:-1000}" -lt 1000 && schedule_complete=true
            push_open=true
            schedule_open=true
            while IFS=$'\t' read -r broad_event broad_sha broad_conclusion broad_completed_at; do
              test -n "$broad_sha" || continue
              if { test "$broad_event" = push && test "$push_open" = false; } \
                || { test "$broad_event" = schedule && test "$schedule_open" = false; }; then
                continue
              fi
              broad_blob="$(git rev-parse "$broad_sha:.github/workflows/quality.yml" 2>/dev/null || true)"
              if test -n "$broad_blob" && test "$broad_blob" != "$current_blob"; then
                if test "$broad_event" = push; then
                  push_complete=true
                  push_open=false
                else
                  schedule_complete=true
                  schedule_open=false
                fi
                continue
              fi
              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$broad_event" "$broad_sha" "$broad_conclusion" "$broad_blob" \
                "$broad_completed_at" >> "$history_file"
            done <<< "$broad_history"
            if test "$history_fetched" = true \
              && test "$push_complete" = true \
              && test "$schedule_complete" = true; then
              history_complete=true
            fi
          fi
          if test "$EVENT_KIND" = schedule \
            || { test "$EVENT_KIND" = push && test "$REF_NAME" = "$DEFAULT_BRANCH"; }; then
            selector_health_clear=false
          fi

          PYTHONPATH=src python3 - \
            "$planner_base_sha" "$planner_head_sha" "$execution_sha" \
            "$subject_verified" "$history_complete" "$current_blob" "$default_sha" \
            "$history_file" "$stack_top" "$GITHUB_OUTPUT" <<'PY'
          import json
          import subprocess
          import sys
          from dataclasses import asdict
          from datetime import UTC, datetime
          from pathlib import Path
          from switchstand.affected_tests import (
              BroadQualityRun, foreground_authority, plan_exact,
              selector_health_clear, validate_execution_tree,
          )
          from switchstand.full_suite_due import (
              FullSuiteDecision, FullSuiteInputs, FullSuitePolicy, evaluate_full_suite_due,
          )

          (base, head, execution, verified, history_complete, current_blob,
           default_sha, history_file, stack_top, output) = sys.argv[1:]
          rows = tuple(line.rstrip('\n').split('\t')
                       for line in Path(history_file).read_text().splitlines())
          runs = tuple(BroadQualityRun(
              event, run_sha, conclusion, workflow_blob or None,
          ) for event, run_sha, conclusion, workflow_blob, _ in rows)
          health = selector_health_clear(
              history_complete=history_complete == 'true',
              current_workflow_blob=current_blob,
              default_sha=default_sha,
              runs=runs,
          )
          plan = validate_execution_tree(Path('.'), plan_exact(Path('.'), base, head), execution)
          decision = foreground_authority(
              plan,
              subject_verified=verified == 'true',
              selector_health_clear=health,
              cumulative_stack_top=stack_top == 'true',
          )
          try:
              candidates = tuple(row for row in rows if (
                  row[2] == 'success' and row[3] == current_blob and row[1] != head and row[4]
              ))
              baseline = max(candidates, key=lambda row: datetime.fromisoformat(row[4])) \
                  if candidates else None
              baseline_sha = baseline[1] if baseline else None
              baseline_at = datetime.fromisoformat(baseline[4]) if baseline else None
              ancestry = commits = production_files = production_lines = None
              planner_policy_changed = unresolved_hard_miss = None
              if baseline_sha:
                  policy_paths = ('src/switchstand/affected_tests.py',
                                  'src/switchstand/full_suite_due.py')
                  policy_identity = lambda sha: subprocess.check_output(
                      ['git', 'rev-parse', *(f'{sha}:{path}' for path in policy_paths)], text=True,
                  )
                  planner_policy_changed = policy_identity(baseline_sha) != policy_identity(head)
                  if history_complete == 'true':
                      unresolved_hard_miss = any(
                          row[2] != 'success' and row[3] == current_blob and row[4]
                          and datetime.fromisoformat(row[4]) > baseline_at for row in rows
                      )
                  ancestry = subprocess.run(
                      ['git', 'merge-base', '--is-ancestor', baseline_sha, head], check=False,
                  ).returncode == 0
                  if ancestry:
                      commits = int(subprocess.check_output(
                          ['git', 'rev-list', '--count', f'{baseline_sha}..{head}'], text=True,
                      ))
                      diff_rows = tuple(line.split('\t') for line in subprocess.check_output(
                          ['git', 'diff', '--numstat', baseline_sha, head], text=True,
                      ).splitlines())
                      production = tuple(row for row in diff_rows if not row[2].startswith(
                          ('tests/', 'docs/'),
                      ))
                      production_files = len(production)
                      production_lines = sum(int(row[0]) + int(row[1]) for row in production)
              adaptive = evaluate_full_suite_due(FullSuiteInputs(
                  landed_sha=head, baseline_sha=baseline_sha, baseline_completed_at=baseline_at,
                  evaluated_at=datetime.now(UTC), commits_since_baseline=commits,
                  changed_production_files=production_files,
                  changed_production_lines=production_lines,
                  selected_tests=len(plan.selected_tests), total_tests=len(subprocess.check_output(
                      ['git', 'ls-files', 'tests/test_*.py'], text=True,
                  ).splitlines()), ancestry_verified=ancestry, planner_mode=plan.mode,
                  high_risk_fallback=plan.mode == 'FULL_FALLBACK' and bool(plan.fallback_reasons),
                  planner_policy_changed=planner_policy_changed,
                  unresolved_hard_miss=unresolved_hard_miss,
                  current_truth_known=history_complete == 'true',
              ), FullSuitePolicy(20, 24 * 60 * 60, 100, 2_000, 50, 0.5))
          except (OSError, subprocess.SubprocessError, TypeError, ValueError):
              adaptive = FullSuiteDecision('UNKNOWN', ('observation-unavailable',), None)
          summary = {
              'authority': decision.mode,
              'authority_reasons': decision.reasons,
              'adaptive_full_suite_shadow': asdict(adaptive),
              'planner': {
                  'planner_revision': plan.planner_revision,
                  'mode': plan.mode,
                  'base': plan.base,
                  'head': plan.head,
                  'changed_paths': plan.changed_paths,
                  'selected_tests': plan.selected_tests,
                  'fallback_reasons': plan.fallback_reasons,
                  'destructive': plan.destructive,
              },
          }
          with open(output, 'a') as sink:
              print(f'mode={decision.mode}', file=sink)
              print('reasons=' + json.dumps(decision.reasons, separators=(',', ':')), file=sink)
              print('selected_tests=' + json.dumps(plan.selected_tests, separators=(',', ':')), file=sink)
              print('planner_json=' + json.dumps(summary['planner'], separators=(',', ':')), file=sink)
              print('adaptive_json=' + json.dumps(asdict(adaptive), separators=(',', ':')), file=sink)
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

  quality_execution:
    needs: plan
    name: Quality execution / ${{ needs.plan.outputs.mode }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: switchstand_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/not_switchstand_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/switchstand_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
          fetch-depth: 0
      - name: Record immutable Quality subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_COMPOSITION_SHA: ${{ github.sha }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack != null && github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            scripts/verify-quality-composition \
              "$QUALITY_COMPOSITION_SHA" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" \
              "$(git rev-parse "origin/$STACK_BASE_REF")" "$STACK_POSITION"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - name: Prepare observational metrics
        run: mkdir -p "$RUNNER_TEMP/test-metrics"
      - name: Authoritative proportional or full-fallback Quality
        env:
          QUALITY_MODE: ${{ needs.plan.outputs.mode }}
          SELECTED_TESTS: ${{ needs.plan.outputs.selected_tests }}
          PLANNER_JSON: ${{ needs.plan.outputs.planner_json }}
        run: |
          printf '%s\n' "$PLANNER_JSON" > "$RUNNER_TEMP/test-metrics/planner.json"
          mapfile -t selected_tests < <(
            python3 -c 'import json,os; print("\n".join(json.loads(os.environ["SELECTED_TESTS"])))'
          )
          test "$QUALITY_MODE" != PROMOTE_TEST_MODULE_ONLY_V1 || test "${#selected_tests[@]}" -gt 0
          quality=(
            docker run --rm --network host -e TEST_DATABASE_URL
            -v "$RUNNER_TEMP/test-metrics:/metrics"
            -v "$PWD:/workspace:ro" -w /workspace switchstand-quality
            sh -c 'PYTHONPATH=/workspace/src /app/.venv/bin/ruff check --no-cache . &&
              PYTHONPATH=/workspace/src /app/.venv/bin/pyright --pythonpath /app/.venv/bin/python &&
              shift 1 && PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider \
              --junitxml=/metrics/junit.xml "$@"' sh "$QUALITY_MODE"
          )
          if test "$QUALITY_MODE" = PROMOTE_TEST_MODULE_ONLY_V1; then
            "${quality[@]}" "${selected_tests[@]}"
          else
            "${quality[@]}"
          fi
      - name: Collect observational metrics
        if: always()
        continue-on-error: true
        env:
          SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          ADAPTIVE_JSON: ${{ needs.plan.outputs.adaptive_json }}
        run: |
          export METRICS_DIR="$RUNNER_TEMP/test-metrics"
          export COMPOSITION_SHA="$(git rev-parse HEAD)"
          export WORKFLOW_BLOB="$(git rev-parse HEAD:.github/workflows/quality.yml)"
          export MANIFEST_BLOBS="$(git rev-parse HEAD:pyproject.toml HEAD:uv.lock HEAD:Dockerfile)"
          export QUALITY_IMAGE="$(docker image inspect switchstand-quality --format '{{.Id}}' 2>/dev/null || true)"
          export QUALITY_PYTHON="$(docker run --rm switchstand-quality /app/.venv/bin/python --version 2>/dev/null || true)"
          QUALITY_RUNTIME="$(docker run --rm switchstand-quality sh -ec '
            dpkg-query -W -f="\${binary:Package}=\${Version}\n"
            sha256sum /usr/local/bin/python3.14 /bin/uv
            /app/.venv/bin/python -c "import importlib.metadata as m; print(\"\\n\".join(sorted(d.metadata[\"Name\"] + \"=\" + d.version for d in m.distributions())))"
          ' 2>/dev/null)" || QUALITY_RUNTIME=""
          export QUALITY_RUNTIME
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          e = os.environ
          identity = {
              "subject_kind": e["SUBJECT_KIND"], "subject_sha": e["SUBJECT_SHA"],
              "base_sha": e["BASE_SHA"] or None,
              "composition_sha": e["COMPOSITION_SHA"] if e["SUBJECT_KIND"] == "composition" else None,
              "github": {"run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                         "job": e["GITHUB_JOB"], "workflow": e["GITHUB_WORKFLOW"], "repository": e["GITHUB_REPOSITORY"]},
              "candidate_image": e["QUALITY_IMAGE"] or None,
              "adaptive_full_suite_shadow": json.loads(e["ADAPTIVE_JSON"]),
              "environment": {"workflow_blob": e["WORKFLOW_BLOB"], "manifest_blobs": e["MANIFEST_BLOBS"],
                              "python": e["QUALITY_PYTHON"] or None,
                              "runtime_packages": hashlib.sha256("\n".join(sorted(e["QUALITY_RUNTIME"].splitlines())).encode()).hexdigest() if e["QUALITY_RUNTIME"] else None,
                              "runner_os": e.get("RUNNER_OS"), "runner_arch": e.get("RUNNER_ARCH"),
                              "runner_image": e.get("ImageOS"), "runner_image_version": e.get("ImageVersion")},
          }
          Path(e["METRICS_DIR"], "identity.json").write_text(json.dumps(identity))
          PY
          execution_kind=full
          test '${{ needs.plan.outputs.mode }}' != PROMOTE_TEST_MODULE_ONLY_V1 || execution_kind=selected
          python3 src/switchstand/test_metrics.py --execution-kind "$execution_kind" \
            --identity "$METRICS_DIR/identity.json" --planner "$METRICS_DIR/planner.json" \
            --junit "$METRICS_DIR/junit.xml" \
            --output "$METRICS_DIR/metrics.json"
      - name: Retain original metrics attempt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-metrics-${{ github.run_id }}-${{ github.run_attempt }}-quality
          path: ${{ runner.temp }}/test-metrics/
          retention-days: 90
          if-no-files-found: warn
  docker_lifecycle:
    needs: plan
    if: needs.plan.outputs.mode != 'PROMOTE_TEST_MODULE_ONLY_V1'
    name: ${{ github.event_name == 'pull_request' && 'PR composition Docker lifecycle' || github.event_name == 'schedule' && 'Scheduled exact-head Docker lifecycle' || 'Exact-head Docker lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
          fetch-depth: 0
      - name: Record immutable Docker lifecycle subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          QUALITY_COMPOSITION_SHA: ${{ github.sha }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack != null && github.event.pull_request.stack.base.ref || github.event.pull_request.base.ref }}
          STACK_POSITION: ${{ github.event.pull_request.stack.position }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            scripts/verify-quality-composition \
              "$QUALITY_COMPOSITION_SHA" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" \
              "$(git rev-parse "origin/$STACK_BASE_REF")" "$STACK_POSITION"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - name: Prove real Docker lifecycle boundary
        run: >-
          docker run --rm
          -e SWITCHSTAND_REAL_DOCKER=1
          -e SWITCHSTAND_REAL_DOCKER_IMAGE=switchstand-quality
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider
          tests/test_docker_lifecycle_real.py'

  quality:
    needs: [plan, quality_execution, docker_lifecycle]
    if: always()
    name: ${{ github.event_name == 'pull_request' && 'PR composition Quality' || github.event_name == 'schedule' && 'Scheduled exact-head Quality' || 'Exact-head Quality' }}
    runs-on: ubuntu-latest
    steps:
      - name: Enforce fail-closed terminal Quality policy
        env:
          MODE: ${{ needs.plan.outputs.mode }}
          PLAN_RESULT: ${{ needs.plan.result }}
          QUALITY_RESULT: ${{ needs.quality_execution.result }}
          DOCKER_RESULT: ${{ needs.docker_lifecycle.result }}
          REASONS: ${{ needs.plan.outputs.reasons }}
        run: |
          printf 'mode=%s\nreasons=%s\nplan=%s\nquality=%s\ndocker=%s\n' \
            "$MODE" "$REASONS" "$PLAN_RESULT" "$QUALITY_RESULT" "$DOCKER_RESULT"
          test "$PLAN_RESULT" = success
          test "$QUALITY_RESULT" = success
          case "$MODE" in
            PROMOTE_TEST_MODULE_ONLY_V1)
              test "$DOCKER_RESULT" = skipped
              ;;
            FULL_FALLBACK)
              test "$DOCKER_RESULT" = success
              ;;
            *)
              exit 1
              ;;
          esac
