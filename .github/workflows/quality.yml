name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - uses: actions/setup-node@1e60f620b9541dca1515407b2a98c4c73dca1c3e
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --requirement requirements-dev.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./scripts/quality
        env:
          QUALITY_BASE_REF: ${{ github.event.pull_request.base.sha }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m compileall -q src tests scripts
      - run: node --test tests/browser_focus.test.js
      - run: node --check src/switchstand/static/app.js
