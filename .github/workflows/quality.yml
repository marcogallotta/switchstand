name: Quality
run-name: Quality / ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
on: [push, pull_request]
jobs:
  quality:
    name: ${{ github.event_name == 'pull_request' && 'PR composition Quality' || 'Exact-head Quality' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: switchstand_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/not_switchstand_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/switchstand_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - name: Record immutable Quality subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$QUALITY_BASE_SHA"
            test "${parents[1]}" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - run: >-
          docker run --rm --network host
          -e TEST_DATABASE_URL
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/ruff check --no-cache . &&
          PYTHONPATH=/workspace/src /app/.venv/bin/pyright --pythonpath /app/.venv/bin/python &&
          PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider'
  docker-lifecycle:
    name: ${{ github.event_name == 'pull_request' && 'PR composition Docker lifecycle' || 'Exact-head Docker lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - name: Record immutable Docker lifecycle subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$QUALITY_BASE_SHA"
            test "${parents[1]}" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - name: Prove real Docker lifecycle boundary
        run: >-
          docker run --rm
          -e SWITCHSTAND_REAL_DOCKER=1
          -e SWITCHSTAND_REAL_DOCKER_IMAGE=switchstand-quality
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider
          tests/test_docker_lifecycle_real.py'

  repository-bundle:
    name: Current repository bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: switchstand-repository-bundle-current
      cancel-in-progress: false
    env:
      BUNDLE_NAME: switchstand-current.bundle
      MANIFEST_NAME: switchstand-current.manifest.json
      CHECKSUM_NAME: switchstand-current.bundle.sha256
      RELEASE_TAG: switchstand-repository-bundle-current
    steps:
      - name: Build and verify current bundle
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git init --bare repository.git
          git -C repository.git remote add origin "https://github.com/${REPOSITORY}.git"
          git -C repository.git fetch --prune origin '+refs/heads/*:refs/heads/*'
          git -C repository.git for-each-ref --format='%(refname) %(objectname)' refs/heads \
            | LC_ALL=C sort > refs.txt
          test -s refs.txt
          git -C repository.git bundle create "$PWD/$BUNDLE_NAME" --branches
          git init --bare verify.git
          git -C verify.git bundle verify "$PWD/$BUNDLE_NAME"
          git clone --quiet --branch main "$PWD/$BUNDLE_NAME" materialized
          while read -r ref sha; do
            branch="${ref#refs/heads/}"
            test "$(git -C materialized rev-parse "refs/remotes/origin/$branch")" = "$sha"
          done < refs.txt
          bundle_sha256="$(sha256sum "$BUNDLE_NAME" | cut -d' ' -f1)"
          snapshot_digest="$(sha256sum refs.txt | cut -d' ' -f1)"
          BUNDLE_SHA256="$bundle_sha256" SNAPSHOT_DIGEST="$snapshot_digest" python - <<'PY'
          import json
          import os
          from pathlib import Path

          refs = dict(line.split() for line in Path("refs.txt").read_text().splitlines())
          manifest = {
              "repository": os.environ["REPOSITORY"],
              "refs": refs,
              "snapshot_digest": os.environ["SNAPSHOT_DIGEST"],
              "bundle_sha256": os.environ["BUNDLE_SHA256"],
              "provenance": {
                  "event_sha": os.environ["EVENT_SHA"],
                  "run_id": os.environ["RUN_ID"],
                  "run_attempt": os.environ["RUN_ATTEMPT"],
              },
          }
          Path(os.environ["MANIFEST_NAME"]).write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          printf '%s  %s\n' "$bundle_sha256" "$BUNDLE_NAME" > "$CHECKSUM_NAME"
      - name: Publish rolling cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target main \
              --title "Current repository bundle cache" \
              --notes "Rolling transport cache; GitHub refs remain source authority."
          fi
          gh release upload "$RELEASE_TAG" "$BUNDLE_NAME" --clobber
          gh release upload "$RELEASE_TAG" "$CHECKSUM_NAME" --clobber
          gh release upload "$RELEASE_TAG" "$MANIFEST_NAME" --clobber
