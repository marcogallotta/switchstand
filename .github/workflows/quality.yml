name: Quality
run-name: Quality / ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
on: [push, pull_request]
jobs:
  quality:
    name: ${{ github.event_name == 'pull_request' && 'PR composition Quality' || 'Exact-head Quality' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: switchstand_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/not_switchstand_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/switchstand_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - name: Record immutable Quality subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$QUALITY_BASE_SHA"
            test "${parents[1]}" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - run: >-
          docker run --rm --network host
          -e TEST_DATABASE_URL
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/ruff check --no-cache . &&
          PYTHONPATH=/workspace/src /app/.venv/bin/pyright --pythonpath /app/.venv/bin/python &&
          PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider'
      - name: Prove real Docker lifecycle boundary
        run: >-
          docker run --rm
          -e SWITCHSTAND_REAL_DOCKER=1
          -e SWITCHSTAND_REAL_DOCKER_IMAGE=switchstand-quality
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider
          tests/test_docker_lifecycle_real.py'

  repository-bundle:
    name: Current repository bundle
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: repository-bundle-current
      cancel-in-progress: false
    steps:
      - name: Fetch authoritative branch refs
        run: |
          git init --bare repository.git
          git -C repository.git remote add origin "https://github.com/$GITHUB_REPOSITORY.git"
          git -C repository.git fetch --prune origin '+refs/heads/*:refs/heads/*'
          git -C repository.git for-each-ref \
            --format='%(refname) %(objectname)' refs/heads | LC_ALL=C sort > refs.txt
          test -s refs.txt

      - name: Build and verify current bundle
        run: |
          git -C repository.git bundle create ../switchstand-current.bundle --branches
          git -C repository.git bundle verify ../switchstand-current.bundle
          git -C repository.git bundle list-heads ../switchstand-current.bundle |
            awk '{print $2" "$1}' | LC_ALL=C sort > bundle-refs.txt
          cmp refs.txt bundle-refs.txt
          git init --bare materialized.git
          git -C materialized.git fetch "$GITHUB_WORKSPACE/switchstand-current.bundle" \
            '+refs/heads/*:refs/heads/*'
          git -C materialized.git for-each-ref \
            --format='%(refname) %(objectname)' refs/heads | LC_ALL=C sort > materialized-refs.txt
          cmp refs.txt materialized-refs.txt
          while read -r ref sha; do
            git -C materialized.git cat-file -e "${sha}^{commit}"
          done < refs.txt
          sha256sum switchstand-current.bundle | awk '{print $1}' \
            > switchstand-current.bundle.sha256

      - name: Build manifest
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          refs = {}
          for line in Path("refs.txt").read_text().splitlines():
              ref, sha = line.split()
              refs[ref] = sha
          canonical = "".join(f"{ref} {refs[ref]}\n" for ref in sorted(refs)).encode()
          manifest = {
              "schema_version": "1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "refs": dict(sorted(refs.items())),
              "snapshot_sha256": hashlib.sha256(canonical).hexdigest(),
              "bundle_sha256": Path("switchstand-current.bundle.sha256").read_text().strip(),
              "event_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          Path("switchstand-current.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY

      - name: Publish rolling repository cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=repository-bundle-current
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Current repository bundle" \
              --notes "Rolling transport cache; GitHub refs remain authoritative."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            switchstand-current.bundle switchstand-current.bundle.sha256
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            switchstand-current.json
