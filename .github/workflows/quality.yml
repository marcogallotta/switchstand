name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install --requirement requirements-dev.lock
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: ./node_modules/.bin/playwright install --with-deps chromium
      - run: ./scripts/quality
        env:
          QUALITY_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: PYTHONPATH=src python -m compileall -q src tests scripts
      - run: node --test tests/browser_focus.test.js
      - run: PYTHONPATH=src python tests/integration/app_server_transport_test.py -v
      - run: PYTHONPATH=src python tests/integration/native_input_transport_test.py -v
      - run: >-
          ./node_modules/.bin/playwright test
          tests/browser/focus_chromium.spec.js
          tests/browser/native_selection_chromium.spec.js
      - run: node --check src/switchstand/static/app.js
