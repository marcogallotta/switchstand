name: Quality
run-name: Quality / ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
on: [push, pull_request]
jobs:
  quality:
    name: ${{ github.event_name == 'pull_request' && 'PR composition Quality' || 'Exact-head Quality' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: switchstand_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/not_switchstand_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/switchstand_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - name: Record immutable Quality subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$QUALITY_BASE_SHA"
            test "${parents[1]}" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - name: Prepare observational metrics
        run: mkdir -p "$RUNNER_TEMP/test-metrics"
      - name: Authoritative Quality
        run: >-
          docker run --rm --network host
          -e TEST_DATABASE_URL
          -v "$RUNNER_TEMP/test-metrics:/metrics"
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/ruff check --no-cache . &&
          PYTHONPATH=/workspace/src /app/.venv/bin/pyright --pythonpath /app/.venv/bin/python &&
          PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider --junitxml=/metrics/junit.xml'
      - name: Collect observational metrics
        if: always()
        continue-on-error: true
        env:
          SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          export METRICS_DIR="$RUNNER_TEMP/test-metrics"
          export COMPOSITION_SHA="$(git rev-parse HEAD)"
          export WORKFLOW_BLOB="$(git rev-parse HEAD:.github/workflows/quality.yml)"
          export MANIFEST_BLOBS="$(git rev-parse HEAD:pyproject.toml HEAD:uv.lock HEAD:Dockerfile)"
          export QUALITY_IMAGE="$(docker image inspect switchstand-quality --format '{{.Id}}' 2>/dev/null || true)"
          export QUALITY_PYTHON="$(docker run --rm switchstand-quality /app/.venv/bin/python --version 2>/dev/null || true)"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          e = os.environ
          identity = {
              "subject_kind": e["SUBJECT_KIND"], "subject_sha": e["SUBJECT_SHA"],
              "base_sha": e["BASE_SHA"] or None,
              "composition_sha": e["COMPOSITION_SHA"] if e["SUBJECT_KIND"] == "composition" else None,
              "github": {"run_id": e["GITHUB_RUN_ID"], "run_attempt": e["GITHUB_RUN_ATTEMPT"],
                         "job": e["GITHUB_JOB"], "workflow": e["GITHUB_WORKFLOW"], "repository": e["GITHUB_REPOSITORY"]},
              "candidate_image": e["QUALITY_IMAGE"] or None,
              "environment": {"workflow_blob": e["WORKFLOW_BLOB"], "manifest_blobs": e["MANIFEST_BLOBS"],
                              "python": e["QUALITY_PYTHON"] or None,
                              "runner_os": e.get("RUNNER_OS"), "runner_arch": e.get("RUNNER_ARCH"),
                              "runner_image": e.get("ImageOS"), "runner_image_version": e.get("ImageVersion")},
          }
          Path(e["METRICS_DIR"], "identity.json").write_text(json.dumps(identity))
          PY
          python3 src/switchstand/test_metrics.py --execution-kind full \
            --identity "$METRICS_DIR/identity.json" --junit "$METRICS_DIR/junit.xml" \
            --output "$METRICS_DIR/metrics.json"
      - name: Retain original metrics attempt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-metrics-${{ github.run_id }}-${{ github.run_attempt }}-quality
          path: ${{ runner.temp }}/test-metrics/
          retention-days: 90
          if-no-files-found: warn
  docker-lifecycle:
    name: ${{ github.event_name == 'pull_request' && 'PR composition Docker lifecycle' || 'Exact-head Docker lifecycle' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.sha }}
      - name: Record immutable Docker lifecycle subject
        env:
          QUALITY_SUBJECT_KIND: ${{ github.event_name == 'pull_request' && 'composition' || 'exact-head' }}
          QUALITY_SUBJECT_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          QUALITY_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          checked_out_sha="$(git rev-parse HEAD)"
          if test "$QUALITY_SUBJECT_KIND" = composition; then
            mapfile -t parents < <(git cat-file -p HEAD | sed -n 's/^parent //p')
            test "${#parents[@]}" -eq 2
            test "${parents[0]}" = "$QUALITY_BASE_SHA"
            test "${parents[1]}" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\nQUALITY_BASE_SHA=%s\nQUALITY_COMPOSITION_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA" "$QUALITY_BASE_SHA" "$checked_out_sha"
          else
            test "$checked_out_sha" = "$QUALITY_SUBJECT_SHA"
            printf 'QUALITY_SUBJECT_KIND=%s\nQUALITY_SUBJECT_SHA=%s\n' \
              "$QUALITY_SUBJECT_KIND" "$QUALITY_SUBJECT_SHA"
          fi
      - run: docker build --target development --tag switchstand-quality .
      - name: Prove real Docker lifecycle boundary
        run: >-
          docker run --rm
          -e SWITCHSTAND_REAL_DOCKER=1
          -e SWITCHSTAND_REAL_DOCKER_IMAGE=switchstand-quality
          -v /var/run/docker.sock:/var/run/docker.sock
          -v "$PWD:/workspace:ro" -w /workspace
          switchstand-quality sh -c
          'PYTHONPATH=/workspace/src /app/.venv/bin/pytest -ra -p no:cacheprovider
          tests/test_docker_lifecycle_real.py'
