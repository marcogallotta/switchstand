name: Temporary updateRefs compatibility

on:
  push:
    branches: [codex/postgres-g5-coordinator]

permissions:
  contents: write

jobs:
  same-sha-ref-update:
    runs-on: ubuntu-latest
    steps:
      - name: Prove GraphQL accepts an atomic same-SHA ref assertion
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          const [owner, name] = process.env.REPOSITORY.split('/');
          const request = async (query, variables) => {
            const response = await fetch('https://api.github.com/graphql', {
              method: 'POST',
              headers: {
                authorization: `Bearer ${process.env.GH_TOKEN}`,
                'content-type': 'application/json',
                'user-agent': 'switchstand-update-refs-compat',
              },
              body: JSON.stringify({ query, variables }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error('GraphQL compatibility transport failed');
            return body;
          };
          const call = async (query, variables) => {
            const body = await request(query, variables);
            if (body.errors?.length) throw new Error('GraphQL compatibility call failed');
            return body.data;
          };
          const found = await call(
            'query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id}}',
            { owner, name },
          );
          const branchRef = `refs/heads/${process.env.REF_NAME}`;
          const markerRef = `refs/tags/switchstand-update-refs-compat/${process.env.HEAD_SHA}`;
          const rejectedRef = `${markerRef}-rejected`;
          const zero = '0'.repeat(40);
          const refQuery = 'query($owner:String!,$name:String!,$branch:String!,$marker:String!,$rejected:String!){repository(owner:$owner,name:$name){branch:ref(qualifiedName:$branch){id target{oid}} marker:ref(qualifiedName:$marker){id target{oid}} rejected:ref(qualifiedName:$rejected){id target{oid}}}}';
          try {
            const clientMutationId = `same-sha-${process.env.HEAD_SHA}`;
            const updated = await call(
              'mutation($input:UpdateRefsInput!){updateRefs(input:$input){clientMutationId}}',
              { input: {
                repositoryId: found.repository.id,
                clientMutationId,
                refUpdates: [
                  { name: branchRef, beforeOid: process.env.HEAD_SHA,
                    afterOid: process.env.HEAD_SHA, force: false },
                  { name: markerRef, beforeOid: zero, afterOid: process.env.HEAD_SHA, force: false },
                ],
              } },
            );
            if (updated.updateRefs.clientMutationId !== clientMutationId) {
              throw new Error('GraphQL compatibility response mismatch');
            }
            let refs = (await call(refQuery, {
              owner, name, branch: branchRef, marker: markerRef, rejected: rejectedRef,
            })).repository;
            if (refs.branch?.target?.oid !== process.env.HEAD_SHA
                || refs.marker?.target?.oid !== process.env.HEAD_SHA) {
              throw new Error('GraphQL atomic update readback mismatch');
            }
            const rejected = await request(
              'mutation($input:UpdateRefsInput!){updateRefs(input:$input){clientMutationId}}',
              { input: {
                repositoryId: found.repository.id,
                clientMutationId: `stale-${process.env.HEAD_SHA}`,
                refUpdates: [
                  { name: branchRef, beforeOid: 'f'.repeat(40),
                    afterOid: process.env.HEAD_SHA, force: false },
                  { name: rejectedRef, beforeOid: zero, afterOid: process.env.HEAD_SHA, force: false },
                ],
              } },
            );
            if (!rejected.errors?.length) throw new Error('GraphQL accepted a stale beforeOid');
            refs = (await call(refQuery, {
              owner, name, branch: branchRef, marker: markerRef, rejected: rejectedRef,
            })).repository;
            if (refs.branch?.target?.oid !== process.env.HEAD_SHA || refs.rejected !== null) {
              throw new Error('GraphQL stale update was not atomic');
            }
            console.log('updateRefs same-SHA CAS and stale atomic rejection: PASS');
          } finally {
            const refs = (await call(refQuery, {
              owner, name, branch: branchRef, marker: markerRef, rejected: rejectedRef,
            })).repository;
            for (const ref of [refs.marker, refs.rejected]) {
              if (ref?.id) await call(
                'mutation($input:DeleteRefInput!){deleteRef(input:$input){clientMutationId}}',
                { input: { refId: ref.id, clientMutationId: `cleanup-${process.env.HEAD_SHA}` } },
              );
            }
          }
          NODE
