name: switchstand

services:
  postgres:
    image: postgres:18-alpine
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: switchstand
      POSTGRES_USER: switchstand
      POSTGRES_PASSWORD: switchstand
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchstand"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres-data:
