[project]
name = "switchstand"
version = "0.1.0"
description = "Bounded provider-neutral work controller over MCP"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3",
]

[project.scripts]
switchstand = "switchstand.mcp:main"

[dependency-groups]
dev = ["pyright>=1.1,<2", "pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchstand"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]
