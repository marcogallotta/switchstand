[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "switchstand"
version = "0.1.0"
description = "Experimental local operator surface for two durable Codex roles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Moinudin Gallotta" }]
dependencies = []

[project.scripts]
switchstand = "switchstand.service:main"
switchstand-stage-a = "switchstand.stage_a_probe:main"

[tool.setuptools.package-data]
switchstand = ["static/*.html", "static/*.js", "static/*.css"]
