[project]
name = "switchstand"
version = "0.1.0"
description = "Bounded provider-neutral work controller over MCP"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
  "alembic>=1.16,<2",
  "fastmcp-slim[server]==4.0.3",
  "httpx>=0.28,<1",
  "mcp==2.1.1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.12,<3",
  "sqlalchemy>=2.0,<3",
  "websockets>=17,<18",
]

[project.scripts]
switchstand = "switchstand.mcp:main"
switchstand-chatgpt-edge = "switchstand.chatgpt_edge:main"
switchstand-stable-auth = "switchstand.stable_auth_runtime:auth_main"
switchstand-delegated-edge = "switchstand.stable_auth_runtime:edge_main"
switchstand-stable-auth-host = "switchstand.stable_auth_host:run"
switchstand-stable-auth-migrate = "switchstand.stable_auth_migration:run"
switchstand-stable-auth-deploy = "switchstand.stable_auth_deployment:run"
switchstand-work-index-migrate = "switchstand.work_index_migration:run"
switchstand-work-metadata-migrate = "switchstand.work_metadata_migration:run"
switchstand-stage1-corpus = "switchstand.work_corpus:run"
switchstand-stage12-cutover = "switchstand.stage12_operator_cli:main"
switchstand-rehearsal-target = "switchstand.rehearsal_target:main"
switchstand-bootstrap-agent-project = "switchstand.durable_agent_project:main"
switchstand-edge-doctor = "switchstand.edge_doctor:run"
switchstand-edge-semantic-probe = "switchstand.edge_semantic_probe:run"
switchstand-provision = "switchstand.provision:main"
switchstand-test-grant = "switchstand.test_grant:main"
switchstand-affected-tests = "switchstand.affected_tests:main"
switchstand-agent-broker = "switchstand.agent_broker:main"
switchstand-agent-executor = "switchstand.agent_executor:main"
switchstand-agent-canary = "switchstand.agent_canary:main"

[dependency-groups]
dev = ["pyright>=1.1,<2", "pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/switchstand"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
include = ["src"]
